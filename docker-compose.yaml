version: "3.9"

services:

  postgres:
    image: postgres:16
    container_name: whitenote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: whitenote
      POSTGRES_PASSWORD: whitenote_password
      POSTGRES_DB: whitenote
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: whitenote-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"   # GRPC
    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: whitenote-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes  # 开启持久化
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: whitenote-minio
    restart: unless-stopped
    ports:
      - "9002:9000"   # API (host 9002 -> container 9000)
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data:
