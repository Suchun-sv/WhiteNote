x-app-base: &app-base
  build: ./backend
  env_file:
    - .env
  environment:
    DATABASE_URL: ${DATABASE_URL:-postgresql://whitenote:whitenote_password@postgres:5432/whitenote}
    REDIS__HOST: ${REDIS__HOST:-redis}
    REDIS__PORT: ${REDIS__PORT:-6379}
    QDRANT_DATABASE__HOST: ${QDRANT_DATABASE__HOST:-qdrant}
  volumes:
    - ${DATA_DIR:-./data}/cache:/app/cache
    - ${DATA_DIR:-./data}/logs:/app/logs
  depends_on:
    postgres:
      condition: service_started
    redis:
      condition: service_healthy
    qdrant:
      condition: service_started

services:

  postgres:
    image: postgres:16
    container_name: whitenote-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: whitenote
      POSTGRES_PASSWORD: whitenote_password
      POSTGRES_DB: whitenote
    ports:
      - "5432:5432"
    volumes:
      - ${DATA_DIR:-./data}/postgres:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: whitenote-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ${DATA_DIR:-./data}/qdrant:/qdrant/storage

  redis:
    image: redis:7-alpine
    container_name: whitenote-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  db-init:
    <<: *app-base
    container_name: whitenote-db-init
    restart: "no"
    command: uv run python -m src.scripts.init_db

  worker:
    <<: *app-base
    container_name: whitenote-worker
    restart: unless-stopped
    command: uv run python worker.py
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      db-init:
        condition: service_completed_successfully

  scheduler:
    <<: *app-base
    container_name: whitenote-scheduler
    restart: unless-stopped
    command: uv run python -m src.scheduler.main
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      db-init:
        condition: service_completed_successfully

  streamlit:
    <<: *app-base
    container_name: whitenote-streamlit
    restart: unless-stopped
    command: uv run streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      db-init:
        condition: service_completed_successfully

  mcp-server:
    <<: *app-base
    container_name: whitenote-mcp
    restart: unless-stopped
    command: uv run python -m src.mcp_server.server --transport http --host 0.0.0.0 --port 8765
    ports:
      - "${MCP_BIND:-127.0.0.1}:8765:8765"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      db-init:
        condition: service_completed_successfully
