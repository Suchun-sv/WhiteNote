# currently only support arXiv
language: "中文（简体）！！！"

auto_ai_title: true
auto_ai_abstract: true

# 收藏功能配置
favorite:
  auto_download_pdf: true       # 收藏后自动下载PDF
  auto_generate_summary: true   # 收藏后自动生成全文总结
  auto_generate_image: true     # 收藏后自动生成漫画解读图

# 漫画图片保存路径
image_save_path: "cache/imgs/"

# Gemini 配置（用于图片生成）
gemini:
  api_key: "YOUR_GEMINI_API_KEY"
  # model: "gemini-2.0-flash-preview-image-generation"
  model: "gemini-3-pro-image-preview"
  image_size: "1K"  # 可选: "1K", "2K", "4K"

scheduler:
  enabled: true
  timezone: "Asia/Shanghai"
  daily_arxiv_job: "0 */10 * * *"

source_list:
  - arXiv

keywords:
  - "vector database"
  - "RAG"
  - "agent"

# Feed definitions — each feed is a tab in the frontend
feeds:
  - id: arxiv
    name: arXiv
    crawler: arxiv
    schedule: "0 */10 * * *"
    params:
      keywords:
        - "vector database"
        - "RAG"
        - "agent"
  - id: iclr-2026
    name: ICLR 2026
    crawler: openreview
    schedule: null
    params:
      venue: "ICLR.cc/2026/Conference"
      status: "accepted"
  - id: cvpr-2025
    name: CVPR 2025
    crawler: dblp
    schedule: null
    params:
      query: "conf/cvpr/2025"
      year: "2025"
      venue_contains: "CVPR"
      limit: 200
      per_page: 100
      min_interval: 1.0
      max_pages: null
      enrich_abstracts: true
  - id: iccv-2025
    name: ICCV 2025
    crawler: dblp
    schedule: null
