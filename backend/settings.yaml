paper_save_path: "cache/papers.json"

chat_litellm:
  model: "gpt-4o-mini"
  api_key: "XXXXX"
  api_base: "https://api.openai.com/v1"


embedding_save_path: "cache/embeddings/"

# qdrant
qdrant_database:
  host: "localhost"
  port: 6333
  collection: "whitenote_papers"

# Redis (for RQ task queue)
redis:
  host: "localhost"
  port: 6379
  db: 0
  password: null

# Semantic Scholar (author affiliations)
semantic_scholar:
  api_key: null            # optional: S2 API key for higher rate limits
  min_interval: 1.5        # seconds between API requests
  retries: 3
  enabled: true

# MinIO (object storage for PDFs and comics)
minio:
  endpoint: "localhost:9002"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  secure: false
  pdf_bucket: "whitenote-pdfs"
  comic_bucket: "whitenote-comics"
